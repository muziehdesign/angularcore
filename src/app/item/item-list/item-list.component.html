<h1 class="invisible">Catalog</h1>

@if (items(); as page) {
  <div class="grid grid-cols-1 gap-x-4 gap-y-10 sm:grid-cols-2 lg:grid-cols-4 xl:gap-x-4 max-w-screen-xl">
    @for (item of page.items; track item) {
      <app-item-card [item]="item" class="group relative"></app-item-card>
    }
  </div>
}
